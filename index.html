<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>UDYCO</title>
<!--
  UDYCO Detenidos © 2026 José Antonio Maldonado Rubiño — página del registro
  Un solo fichero, sin red: se manda por WhatsApp al policía, se abre en el móvil
  y funciona. Lo que se fotografía o graba se empaqueta CIFRADO con la clave de
  esta operación y se comparte con el jefe (WhatsApp, Telegram…) como documento:
  sin comprimir y con su nombre, para que el programa sepa de qué registro y de
  qué detenido es cada foto.
-->
<style>
  :root { --negro:#0e0f12; --carbon:#1b1d22; --oro:#f2a51a; --verde:#1b7a4b; --rojo:#c0362c; --ambar:#a86100; --linea:#dfe2e8; --suave:#5c6370; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#f3f4f7; color:#16181d; }
  header { background:var(--negro); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:5; }
  header img { width:40px; }
  header b { display:block; font-size:17px; } header small { color:#c3c7cf; font-size:13px; }
  header button { margin-left:auto; background:none; border:2px solid #3a3e47; color:#fff; border-radius:12px; padding:8px 12px; font:inherit; font-size:15px; }
  main { padding:16px; max-width:560px; margin:0 auto 90px; }
  h1 { font-size:22px; margin:6px 0 14px; } h2 { font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--suave); margin:22px 0 10px; }
  .gordo { display:flex; align-items:center; gap:14px; width:100%; min-height:68px; padding:14px 16px; margin-bottom:10px; border-radius:16px;
           border:2px solid var(--linea); background:#fff; font:inherit; font-weight:700; text-align:left; color:inherit; }
  .gordo .ic { font-size:28px; width:36px; text-align:center; flex:none; }
  .gordo small { display:block; font-weight:500; color:var(--suave); font-size:14px; }
  .gordo .fin { margin-left:auto; font-size:14px; font-weight:800; }
  .gordo.primario { background:var(--oro); border-color:var(--oro); }
  .gordo.oscuro { background:var(--negro); border-color:var(--negro); color:#fff; } .gordo.oscuro small { color:#c3c7cf; }
  .gordo.hecho { border-color:var(--verde); }
  .ok { color:var(--verde); } .mal { color:var(--rojo); } .ambar { color:var(--ambar); }
  .tipos { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .tipos button { min-height:60px; border-radius:14px; border:2px solid var(--linea); background:#fff; font:inherit; font-weight:800; }
  .tipos button.on { background:var(--negro); border-color:var(--negro); color:var(--oro); }
  .foto { position:relative; display:flex; align-items:center; gap:14px; min-height:92px; padding:10px 14px; margin-bottom:10px; border-radius:16px;
          border:2px dashed #c9cdd6; background:#fff; font-weight:700; }
  .foto.lleno { border-style:solid; border-color:var(--verde); }
  .foto img { width:96px; height:66px; object-fit:cover; border-radius:10px; flex:none; background:#dde1e8; }
  .foto .ic { font-size:34px; width:96px; text-align:center; flex:none; }
  .foto input { position:absolute; inset:0; opacity:0; }
  .foto .quitar { margin-left:auto; position:relative; z-index:2; border:0; background:#fbe6e4; color:var(--rojo); border-radius:10px; padding:10px 12px; font:inherit; font-weight:800; }
  input[type=text], textarea { width:100%; font:inherit; padding:14px; border-radius:14px; border:2px solid var(--linea); background:#fff; }
  textarea { min-height:80px; }
  label.campo { display:block; font-weight:700; margin:12px 0 6px; }
  .pie { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--linea); }
  .pie .gordo { margin:0; justify-content:center; }
  .aviso { background:#fff4dc; border-radius:14px; padding:12px 14px; font-size:15px; margin:10px 0; }
  .error { background:#fbe6e4; color:var(--rojo); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:13px; font-weight:800; padding:3px 9px; border-radius:999px; background:#eceef2; }
  .chip.ok { background:#e2f4ea; } .chip.env { background:var(--negro); color:var(--oro); }
  [hidden] { display:none !important; }
  /* Cámara con marco y revisión de la foto */
  .capa { position:fixed; inset:0; z-index:40; background:#000; color:#fff; display:flex; flex-direction:column; }
  .capa video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .marco { position:absolute; border:3px solid var(--oro); border-radius:14px; box-shadow:0 0 0 200vmax rgba(0,0,0,.62); pointer-events:none; }
  .marco::after { content:""; position:absolute; left:6%; right:6%; bottom:9%; height:18%; border:2px dashed rgba(242,165,26,.7); border-radius:6px; }
  .marco.sin-mrz::after { display:none; }
  .cam-texto { position:absolute; left:16px; right:16px; top:calc(14px + env(safe-area-inset-top)); text-align:center; font-weight:800; font-size:18px; text-shadow:0 1px 3px #000; }
  .cam-texto small { display:block; font-weight:600; font-size:14px; color:#e8e8e8; }
  .cam-botones { position:absolute; left:0; right:0; bottom:0; padding:18px 20px calc(18px + env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:space-between; }
  .cam-botones button { background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:14px; padding:14px 16px; font:inherit; font-weight:800; min-width:92px; }
  .disparo { width:78px !important; min-width:78px !important; height:78px; border-radius:50% !important; background:#fff !important; border:6px solid var(--oro) !important; padding:0 !important; }
  .rev { background:#111318; overflow:auto; }
  .rev-cuerpo { padding:14px 16px calc(20px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; width:100%; }
  /* la foto nunca pasa de media pantalla: en vertical empujaba los botones fuera
     y, como el dedo sobre ella mueve el marco, no había forma de llegar a ellos */
  .rev canvas { max-width:100%; max-height:48vh; width:auto; height:auto; margin:0 auto; border-radius:12px; background:#222; display:block; touch-action:none; }
  .rev-botones { position:sticky; bottom:0; background:#111318; padding:8px 0 calc(6px + env(safe-area-inset-bottom)); margin-top:6px; }
  .rev-botones .gordo { margin-bottom:8px; }
  .rev .diag { font-size:12px; color:#8a8f99; margin:6px 0 0; }
  .rev .chips { margin:12px 0; } .rev .chip { font-size:15px; padding:6px 12px; background:#2a2d35; color:#fff; }
  .rev .chip.ok { background:#1b4d33; } .rev .chip.mal { background:#6e211b; } .rev .chip.ambar { background:#6a4a07; }
  .rev label { display:flex; align-items:center; gap:10px; margin:10px 0; font-weight:700; font-size:15px; }
  .rev input[type=range] { flex:1; accent-color:var(--oro); }
  .rev .fila { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
  .rev .fila button, .rev .secund { min-height:52px; border-radius:14px; border:2px solid #3a3e47; background:#1b1d22; color:#fff; font:inherit; font-weight:800; }
  .rev .gordo:disabled { opacity:.35; }
  .rev .secund { width:100%; margin-top:6px; font-size:15px; font-weight:700; }
  .rev .motivo { background:#6e211b; border-radius:12px; padding:10px 12px; margin:10px 0; font-weight:700; }
</style>
</head>

  window.addEventListener("unhandledrejection", function (ev) {
    var r = ev.reason;
    mostrar(r && r.message ? r.message : String(r));
  });
})();
</script>
<script>
"use strict";
// Los datos de la operación (clave, registros…) van DENTRO del fichero que se
// descarga, o en el ENLACE, tras «#d=» (la página publicada en una web https
// es igual para todas las operaciones y no lleva ningún dato). Lo que va tras
// «#» no sale nunca del móvil: el navegador no lo envía a la web.
const OP_DENTRO = null;
function opDelEnlace() {
  try {
    const m = location.hash.match(/[#&]d=([A-Za-z0-9_-]+)/);
    if (!m) return null;
    let b = m[1].replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0))));
  } catch (_) { return null; }
}
const SIN_DATOS = !(OP_DENTRO || opDelEnlace());
const OP = OP_DENTRO || opDelEnlace() || { op_id: "", atestado: "", nombre: "", clave: "", registros: [] };
if (!SIN_DATOS) {
  document.title = "UDYCO · " + OP.atestado;
  document.getElementById("cabAtestado").textContent = "Atestado " + OP.atestado;
}
const TIPOS_DOC = { DNI: "DNI", NIE: "NIE / TIE", PASAPORTE: "Pasaporte", NINGUNO: "Sin documento" };
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ── Estado (se guarda en el móvil por si se cierra la página) ────────────────
let E = { agente: "", dispositivo: "", registro: null, lugar: "", detenidos: {} };   // detenidos: {clave_registro: [{n, doc, nota, fotos:{}, enviado}]}
const FOTOS = {};   // id → Blob (en memoria; y en IndexedDB si el navegador deja)
let vista = { p: "inicio" };
const CLAVE_E = "udyco_campo_" + OP.op_id;

function guardarE() { try { localStorage.setItem(CLAVE_E, JSON.stringify(E)); } catch (_) {} }
try { E = Object.assign(E, JSON.parse(localStorage.getItem(CLAVE_E) || "{}")); } catch (_) {}
if (!E.dispositivo) { E.dispositivo = Math.random().toString(36).slice(2, 10); guardarE(); }

// IndexedDB es solo para no perder las fotos si se cierra la pestaña. En el
// iPhone (Safari abriendo la página como fichero, o dentro de un visor) a veces
// no contesta NUNCA: ni éxito ni error. Por eso nada espera por él más de
// 1,5 s y la página se pinta sin él; las fotos quedan en memoria (FOTOS).
let db = null, sinAlmacen = false;
const conTiempo = (promesa, ms, porDefecto) =>
  Promise.race([promesa, new Promise(r => setTimeout(() => r(porDefecto), ms))]);
function abrirDB() {
  return conTiempo(new Promise(res => {
    try {
      if (!window.indexedDB) return res();
      const r = indexedDB.open("udyco_campo", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("fotos");
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = r.onblocked = () => res();
    } catch (_) { res(); }
  }), 1500);
}
function dbPut(id, blob) { try { db && db.transaction("fotos", "readwrite").objectStore("fotos").put(blob, id); } catch (_) {} }
function dbDel(id) { try { db && db.transaction("fotos", "readwrite").objectStore("fotos").delete(id); } catch (_) {} }
function dbGet(id) {
  return conTiempo(new Promise(res => {
    if (!db) return res(null);
    try { const r = db.transaction("fotos").objectStore("fotos").get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }
    catch (_) { res(null); }
  }), 1500, null);
}
async function blobDe(id) { return FOTOS[id] || (FOTOS[id] = await dbGet(id)); }

// ── Utilidades ───────────────────────────────────────────────────────────────
const claveReg = () => E.registro || ("libre:" + E.lugar);
const nombreReg = () => { const r = OP.registros.find(x => x.id === E.registro); return r ? r.lugar : E.lugar; };
const indiceReg = () => { const i = OP.registros.findIndex(x => x.id === E.registro); return i >= 0 ? i + 1 : 0; };
const detsReg = () => (E.detenidos[claveReg()] = E.detenidos[claveReg()] || []);
const hora = () => new Date().toTimeString().slice(0, 5);

function ranuras(doc) {
  if (doc === "PASAPORTE") return [["doc-datos", "📖", "Hoja de datos del pasaporte", "La de la foto, con las 2 líneas de abajo"], ["doc-otra", "📄", "Otra página (opcional)", ""]];
  if (doc === "NINGUNO") return [["cara", "🙂", "Foto de la cara (opcional)", "Para identificarlo"], ["otro-doc", "📄", "Cualquier papel que lleve (opcional)", ""]];
  return [["doc-delante", "🪪", `${TIPOS_DOC[doc] || "Documento"} — por DELANTE`, "Con la foto y el número"],
          ["doc-detras", "🔁", `${TIPOS_DOC[doc] || "Documento"} — por DETRÁS`, "La parte de las líneas «<<<»"]];
}

// ── Pantallas ────────────────────────────────────────────────────────────────
function pintar() {
  $("#atras").hidden = vista.p === "inicio";
  $("#cabSub").textContent = vista.p === "inicio" ? (OP.nombre || "Página del registro") : nombreReg();
  $("#pie").hidden = true;
  ({ inicio: pInicio, registro: pRegistro, detenido: pDetenido })[vista.p]();
  window.scrollTo(0, 0);
}

function pInicio() {
  $("#pantalla").innerHTML = `${sinAlmacen ? '<div class="aviso">Este navegador no guarda las fotos en el móvil: <b>no cierres la página</b> hasta haberlas enviado.</div>' : ""}
    <label class="campo">¿Quién eres? <small style="font-weight:500">(C.P. o indicativo)</small></label>
    <input type="text" id="agente" value="${esc(E.agente)}" placeholder="C.P. 123456 / ZETA 4">
    <h2>¿En qué registro estás?</h2>
    ${OP.registros.map((r, i) => {
      const n = (E.detenidos[r.id] || []).length;
      return `<button class="gordo" data-reg="${esc(r.id)}"><span class="ic">🏠</span><span>${i + 1}. ${esc(r.lugar)}
        <small>${esc(r.tipo || "")}${r.hora ? " · " + esc(r.hora) + " h" : ""}</small></span>${n ? `<span class="fin">${n} det.</span>` : ""}</button>`;
    }).join("") || '<div class="aviso">El jefe todavía no ha puesto registros: escribe la dirección.</div>'}
    <label class="campo">Otra dirección</label>
    <input type="text" id="otraDir" placeholder="C/ … nº …, localidad" value="${esc(E.registro ? "" : E.lugar)}">
    <button class="gordo oscuro" id="irOtra" style="margin-top:10px"><span class="ic">📍</span><span>Usar esta dirección</span></button>`;
  $("#agente").onchange = ev => { E.agente = ev.target.value.trim(); guardarE(); };
  document.querySelectorAll("[data-reg]").forEach(b => b.onclick = () => { E.registro = b.dataset.reg; E.lugar = ""; guardarE(); vista = { p: "registro" }; pintar(); });
  $("#irOtra").onclick = () => {
    const v = $("#otraDir").value.trim();
    if (!v) return alert("Escribe la dirección.");
    E.registro = null; E.lugar = v; guardarE(); vista = { p: "registro" }; pintar();
  };
}

function estadoDet(d) {
  const n = Object.keys(d.fotos).length;
  if (d.enviado) return `<span class="chip env">enviado ${esc(d.enviado)}</span>`;
  return n ? `<span class="chip ok">${n} fichero${n === 1 ? "" : "s"}</span>` : '<span class="chip">vacío</span>';
}

function pRegistro() {
  const dets = detsReg();
  $("#pantalla").innerHTML = `<h1>🏠 ${esc(nombreReg())}</h1>
    ${dets.map(d => `<button class="gordo ${d.enviado ? "hecho" : ""}" data-det="${d.n}"><span class="ic">👤</span>
      <span>Detenido ${d.n}<small>${esc(TIPOS_DOC[d.doc] || "Documento sin elegir")}${d.nota ? " · " + esc(d.nota.slice(0, 30)) : ""}</small></span>
      <span class="fin">${estadoDet(d)}</span></button>`).join("")}
    <button class="gordo primario" id="nuevoDet"><span class="ic">＋</span><span>Detenido ${dets.length + 1}</span></button>`;
  document.querySelectorAll("[data-det]").forEach(b => b.onclick = () => { vista = { p: "detenido", n: +b.dataset.det }; pintar(); });
  $("#nuevoDet").onclick = () => {
    dets.push({ n: dets.length + 1, doc: "DNI", nota: "", fotos: {}, enviado: "" });
    guardarE(); vista = { p: "detenido", n: dets.length }; pintar();
  };
  const pendientes = dets.filter(d => Object.keys(d.fotos).length && !d.enviado);
  if (dets.some(d => Object.keys(d.fotos).length)) {
    $("#pie").hidden = false;
    $("#pie").innerHTML = `<button class="gordo oscuro" id="enviarTodos"><span class="ic">📤</span>
      <span>Enviar ${pendientes.length ? `los ${pendientes.length} pendientes` : "todo el registro"}</span></button>`;
    $("#enviarTodos").onclick = () => enviar((pendientes.length ? pendientes : dets).filter(d => Object.keys(d.fotos).length));
  }
}

async function pDetenido() {
  const d = detsReg().find(x => x.n === vista.n);
  const huecos = ranuras(d.doc);
  const extra = Object.keys(d.fotos).filter(k => k.startsWith("extra") || (!huecos.some(h => h[0] === k) && k !== "audio"));
  $("#pantalla").innerHTML = `<h1>👤 Detenido ${d.n}</h1>
    <div class="tipos">${Object.entries(TIPOS_DOC).map(([k, t]) => `<button data-doc="${k}" class="${d.doc === k ? "on" : ""}">${t}</button>`).join("")}</div>
    <h2>${d.doc === "NINGUNO" ? "Sin documento: graba el audio" : "Fotos del documento"}</h2>
    ${huecos.map(([k, ic, t, s]) => ranura(d, k, ic, t, s, "image/*", "environment")).join("")}
    ${extra.map(k => ranura(d, k, "📷", "Otra foto", "", "image/*", "environment")).join("")}
    <label class="foto"><span class="ic">📷</span><span>Añadir otra foto<small style="display:block;font-weight:500;color:var(--suave)">Tatuajes, otro documento…</small></span>
      <input type="file" accept="image/*" capture="environment" data-hueco="extra-${Date.now()}"></label>
    <h2>Audio ${d.doc === "NINGUNO" ? "(obligatorio)" : "(si hace falta)"}</h2>
    ${ranura(d, "audio", "🎤", d.fotos.audio ? "Audio grabado" : "Grabar audio de la filiación",
      "Nombre, apellidos, fecha y lugar de nacimiento, padres, domicilio, nacionalidad…", "audio/*", "")}
    ${d.doc === "NINGUNO" ? '<div class="aviso">Di despacio: <b>nombre, apellidos, nacido el… en…, hijo de… y de…, nacionalidad, domicilio</b>. Nombres raros, deletreados.</div>' : ""}
    <label class="campo">Nota para el jefe (opcional)</label>
    <textarea id="nota" placeholder="Abogado de oficio, no declara, avisar a su madre…">${esc(d.nota)}</textarea>`;
  for (const [k] of [...huecos, ...extra.map(x => [x]), ["audio"]]) {
    const img = document.querySelector(`[data-mini="${k}"]`);
    if (img && d.fotos[k] && k !== "audio") { const b = await blobDe(d.fotos[k]); if (b) img.src = URL.createObjectURL(b); }
  }
  document.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => { d.doc = b.dataset.doc; d.enviado = ""; guardarE(); pintar(); });
  document.querySelectorAll("input[data-hueco]").forEach(inp => inp.onchange = async () => {
    const f = inp.files[0];
    if (!f) return;
    const id = `${claveReg()}|${d.n}|${inp.dataset.hueco}`;
    FOTOS[id] = f.type.startsWith("audio") || /\.(m4a|opus|ogg|mp3|wav|amr|3gp|aac|webm)$/i.test(f.name) ? f : await reducir(f);
    dbPut(id, FOTOS[id]);
    d.fotos[inp.dataset.hueco] = id; d.enviado = ""; guardarE(); pintar();
  });
  document.querySelectorAll("[data-camara]").forEach(el => el.onclick = async () => {
    const blob = await fotoDocumento(el.dataset.camara, d.doc);
    if (!blob) return;
    const id = `${claveReg()}|${d.n}|${el.dataset.camara}`;
    FOTOS[id] = blob; dbPut(id, blob);
    d.fotos[el.dataset.camara] = id; d.enviado = ""; guardarE(); pintar();
  });
  document.querySelectorAll("[data-quitar]").forEach(b => b.onclick = ev => {
    ev.preventDefault(); ev.stopPropagation();
    dbDel(d.fotos[b.dataset.quitar]); delete d.fotos[b.dataset.quitar]; d.enviado = ""; guardarE(); pintar();
  });
  $("#nota").onchange = ev => { d.nota = ev.target.value; d.enviado = ""; guardarE(); };
  $("#pie").hidden = false;
  $("#pie").innerHTML = `<button class="gordo oscuro" id="enviarUno"><span class="ic">📤</span><span>${d.enviado ? `Enviado a las ${esc(d.enviado)} · reenviar` : "Enviar al jefe"}</span></button>`;
  $("#enviarUno").onclick = () => { d.nota = $("#nota").value; guardarE(); enviar([d]); };
}

function ranura(d, k, ic, titulo, sub, accept, capture) {
  const lleno = !!d.fotos[k];
  if (MARCO[k]) {   // documento: cámara con marco, recorte y control de calidad
    return `<div class="foto ${lleno ? "lleno" : ""}" role="button" data-camara="${k}">
    ${lleno ? `<img data-mini="${k}" alt="">` : `<span class="ic">${ic}</span>`}
    <span>${esc(titulo)}${sub ? `<small style="display:block;font-weight:500;color:var(--suave)">${esc(sub)}</small>` : ""}
      ${lleno ? '<small class="ok" style="display:block">✓ hecha · toca para repetir</small>' : ""}</span>
    ${lleno ? `<button class="quitar" data-quitar="${k}">Quitar</button>` : ""}</div>`;
  }
  return `<label class="foto ${lleno ? "lleno" : ""}">
    ${lleno && k !== "audio" ? `<img data-mini="${k}" alt="">` : `<span class="ic">${lleno ? "✅" : ic}</span>`}
    <span>${esc(titulo)}${sub ? `<small style="display:block;font-weight:500;color:var(--suave)">${esc(sub)}</small>` : ""}
      ${lleno ? '<small class="ok" style="display:block">✓ hecha · toca para repetir</small>' : ""}</span>
    ${lleno ? `<button class="quitar" data-quitar="${k}">Quitar</button>` : ""}
    <input type="file" accept="${accept}" ${capture ? `capture="${capture}"` : "capture"} data-hueco="${k}"></label>`;
}

// La foto se reduce en el móvil: lado mayor 3000 px (la MRZ se sigue leyendo perfecta)
async function reducir(fichero) {
  try {
    const bmp = await createImageBitmap(fichero, { imageOrientation: "from-image" });
    const f = Math.min(1, 3000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * f); c.height = Math.round(bmp.height * f);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
  } catch (_) { return fichero; }
}

// ── Foto del documento: cámara con marco, recorte y control de calidad ──────
// Umbrales calibrados con fotos reales de DNI (varianza del Laplaciano sobre la
// tarjeta reducida a 600 px): nítida ≈ 450-1200, movida ≈ 40-115. Son los mismos
// criterios que motor_ia/imagen.py, pero aquí se obliga a repetir la foto: en el
// PC ya es tarde, el policía se ha ido del registro.
const CALIDAD = { nitidezMin: 120, luzMin: 60, reflejoAviso: 0.03, reflejoMax: 0.08, intentosParaForzar: 3 };
const MARCO = {
  "doc-delante": { prop: 85.6 / 54, mrz: false, texto: "Encaja el documento POR DELANTE dentro del marco" },
  "doc-detras": { prop: 85.6 / 54, mrz: true, texto: "Encaja el documento POR DETRÁS",
                  sub: "Las líneas «<<<» dentro de la zona de puntos" },
  "doc-datos": { prop: 125 / 88, mrz: true, texto: "Encaja la hoja de datos del pasaporte",
                 sub: "Las 2 líneas «<<<» dentro de la zona de puntos" },
};
let flujo = null, fallo_camara = "";

async function fotoDocumento(hueco) {
  const cfg = MARCO[hueco];
  for (let intentos = 1; ; intentos++) {
    const lienzo = await capturar(cfg);
    if (!lienzo) return null;
    const r = await revisar(lienzo, intentos);
    if (r === "repetir") continue;
    return r;   // Blob, o null si se canceló
  }
}

async function capturar(cfg) {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try { return await capturarConCamara(cfg); }
    catch (e) {   // sin permiso o sin cámara: plan B
      if (e && e.name === "Cancelado") return null;
      fallo_camara = `${(e && e.name) || "error"}${e && e.message ? ": " + e.message : ""}`;
    }
  } else {
    fallo_camara = window.isSecureContext ? "el navegador no da acceso a la cámara" : "página abierta como fichero no seguro";
  }
  return capturarDeFichero(cfg);
}

function marcoEnPantalla(cfg) {
  const W = innerWidth, H = innerHeight;
  let w = W * 0.9, h = w / cfg.prop;
  if (h > H * 0.62) { h = H * 0.62; w = h * cfg.prop; }
  return { x: (W - w) / 2, y: (H - h) / 2 - H * 0.03, w, h };
}

function pararCamara() {
  if (flujo) flujo.getTracks().forEach(t => t.stop());
  flujo = null;
}

async function capturarConCamara(cfg) {
  flujo = await navigator.mediaDevices.getUserMedia({ audio: false,
    video: { facingMode: { ideal: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 } } });
  const pista = flujo.getVideoTracks()[0];
  try { await pista.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); } catch (_) {}
  const v = $("#video");
  v.srcObject = flujo;
  $("#camara").hidden = false;
  $("#camTexto").innerHTML = `${esc(cfg.texto)}${cfg.sub ? `<small>${esc(cfg.sub)}</small>` : ""}`;
  $("#marco").classList.toggle("sin-mrz", !cfg.mrz);
  const colocar = () => {
    const m = marcoEnPantalla(cfg);
    Object.assign($("#marco").style, { left: m.x + "px", top: m.y + "px", width: m.w + "px", height: m.h + "px" });
  };
  colocar();
  addEventListener("resize", colocar);
  const puede = pista.getCapabilities ? pista.getCapabilities() : {};
  let luz = false;
  $("#camLinterna").style.visibility = puede.torch ? "visible" : "hidden";
  $("#camLinterna").onclick = async () => {
    luz = !luz;
    try { await pista.applyConstraints({ advanced: [{ torch: luz }] }); } catch (_) {}
  };
  return new Promise((resolver, rechazar) => {
    const cerrar = () => { removeEventListener("resize", colocar); pararCamara(); v.srcObject = null; $("#camara").hidden = true; };
    $("#camCancelar").onclick = () => { cerrar(); rechazar(Object.assign(new Error("cancelado"), { name: "Cancelado" })); };
    $("#camDisparo").onclick = async () => {
      if (!v.videoWidth) return;
      $("#camDisparo").disabled = true;
      try { const lienzo = await disparar(v, pista, cfg); cerrar(); resolver(lienzo); }
      catch (e) { cerrar(); rechazar(e); }
      finally { $("#camDisparo").disabled = false; }
    };
  });
}

// El marco se ve sobre el vídeo en «object-fit: cover»: se pasa a coordenadas
// de la imagen (0-1) y se recorta de la foto a resolución completa si la cámara
// la da con el mismo encuadre; si no, del propio vídeo.
async function disparar(v, pista, cfg) {
  const W = v.clientWidth, H = v.clientHeight, vw = v.videoWidth, vh = v.videoHeight;
  const k = Math.max(W / vw, H / vh), ox = (W - vw * k) / 2, oy = (H - vh * k) / 2;
  const m = marcoEnPantalla(cfg), mx = m.w * 0.03, my = m.h * 0.03;
  const n = {
    x0: Math.max(0, (m.x - mx - ox) / (vw * k)), y0: Math.max(0, (m.y - my - oy) / (vh * k)),
    x1: Math.min(1, (m.x + m.w + mx - ox) / (vw * k)), y1: Math.min(1, (m.y + m.h + my - oy) / (vh * k)),
  };
  let fuente = v, fw = vw, fh = vh;
  if (typeof ImageCapture !== "undefined") {
    try {
      const bmp = await createImageBitmap(await new ImageCapture(pista).takePhoto(), { imageOrientation: "from-image" });
      if (Math.abs(bmp.width / bmp.height - vw / vh) < 0.02) { fuente = bmp; fw = bmp.width; fh = bmp.height; }
    } catch (_) {}
  }
  return recorte(fuente, n.x0 * fw, n.y0 * fh, (n.x1 - n.x0) * fw, (n.y1 - n.y0) * fh);
}

function recorte(fuente, sx, sy, sw, sh) {
  const f = Math.min(1, 2400 / sw);
  const c = document.createElement("canvas");
  c.width = Math.round(sw * f); c.height = Math.round(sh * f);
  c.getContext("2d").drawImage(fuente, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}

// Plan B: sin permiso de cámara (o navegador sin getUserMedia). Se usa la cámara
// normal del móvil y el marco se ajusta a mano sobre la foto.
function capturarDeFichero(cfg) {
  return new Promise(resolver => {
    $("#revision").hidden = false;
    $("#revCuerpo").innerHTML = `<h1 style="font-size:20px">📷 ${esc(cfg.texto)}</h1>
      <div class="aviso" style="color:#16181d">Esta página no puede usar la cámara directamente: se abrirá la cámara del móvil
        y después ajustarás el marco al documento.${cfg.sub ? " " + esc(cfg.sub) + "." : ""}</div>
      <button class="gordo primario" id="resAbrir" style="justify-content:center"><span class="ic">📷</span><span>Hacer la foto</span></button>
      <button class="secund" id="resCancelar">Cancelar</button>
      ${fallo_camara ? `<p class="diag">Cámara con marco no disponible (${esc(fallo_camara)})</p>` : ""}`;
    const inp = $("#camReserva");
    $("#resCancelar").onclick = () => { $("#revision").hidden = true; resolver(null); };
    $("#resAbrir").onclick = () => { inp.value = ""; inp.click(); };
    inp.onchange = async () => {
      const f = inp.files[0];
      if (!f) return;
      let bmp;
      try { bmp = await createImageBitmap(f, { imageOrientation: "from-image" }); }
      catch (_) { return alert("No se ha podido abrir la foto."); }
      resolver(await recortarAMano(bmp, cfg));
    };
  });
}

function recortarAMano(bmp, cfg) {
  return new Promise(resolver => {
    const f = Math.min(1, 1000 / bmp.width);
    const W = Math.round(bmp.width * f), H = Math.round(bmp.height * f);
    const maxW = Math.min(W, H * cfg.prop);
    const m = { w: maxW * 0.9 };
    m.h = m.w / cfg.prop; m.x = (W - m.w) / 2; m.y = (H - m.h) / 2;
    $("#revision").hidden = false;
    $("#revCuerpo").innerHTML = `<h1 style="font-size:20px">Ajusta el marco al documento</h1>
      <canvas id="revLienzo"></canvas>
      <label>↔ Tamaño <input type="range" id="recTam" min="30" max="100" value="90"></label>
      <p style="font-size:14px;color:#c3c7cf;margin:0 0 4px">Arrastra el marco con el dedo hasta que el documento quede dentro.</p>
      <div class="rev-botones">
        <button class="gordo primario" id="recVale" style="justify-content:center"><span class="ic">✂️</span><span>Recortar</span></button>
        <div class="fila" style="margin:0"><button id="recEntera">Foto entera</button><button id="recCancelar">Cancelar</button></div>
      </div>`;
    const lienzo = $("#revLienzo"), x = lienzo.getContext("2d");
    lienzo.width = W; lienzo.height = H;
    const dibujar = () => {
      x.drawImage(bmp, 0, 0, W, H);
      x.fillStyle = "rgba(0,0,0,.55)";
      x.beginPath(); x.rect(0, 0, W, H); x.rect(m.x, m.y, m.w, m.h); x.fill("evenodd");
      x.strokeStyle = "#f2a51a"; x.lineWidth = 4; x.strokeRect(m.x, m.y, m.w, m.h);
    };
    const encajar = () => { m.x = Math.min(Math.max(0, m.x), W - m.w); m.y = Math.min(Math.max(0, m.y), H - m.h); };
    dibujar();
    let ant = null;
    lienzo.onpointerdown = ev => { ant = [ev.clientX, ev.clientY]; lienzo.setPointerCapture(ev.pointerId); };
    lienzo.onpointermove = ev => {
      if (!ant) return;
      const k = W / lienzo.clientWidth;
      m.x += (ev.clientX - ant[0]) * k; m.y += (ev.clientY - ant[1]) * k;
      ant = [ev.clientX, ev.clientY]; encajar(); dibujar();
    };
    lienzo.onpointerup = lienzo.onpointercancel = () => { ant = null; };
    $("#recTam").oninput = ev => {
      const cx = m.x + m.w / 2, cy = m.y + m.h / 2;
      m.w = maxW * ev.target.value / 100; m.h = m.w / cfg.prop; m.x = cx - m.w / 2; m.y = cy - m.h / 2;
      encajar(); dibujar();
    };
    $("#recVale").onclick = () => resolver(recorte(bmp, m.x / f, m.y / f, m.w / f, m.h / f));
    $("#recEntera").onclick = () => resolver(recorte(bmp, 0, 0, bmp.width, bmp.height));
    $("#recCancelar").onclick = () => { $("#revision").hidden = true; resolver(null); };
  });
}

// Nitidez (varianza del Laplaciano), luz (brillo medio) y reflejo (píxeles quemados)
function medir(lienzo) {
  const f = Math.min(1, 600 / Math.max(lienzo.width, lienzo.height));
  const w = Math.round(lienzo.width * f), h = Math.round(lienzo.height * f);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(lienzo, 0, 0, w, h);
  const px = x.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
  let suma = 0, quemados = 0;
  for (let i = 0, j = 0; i < g.length; i++, j += 4) {
    const y = 0.299 * px[j] + 0.587 * px[j + 1] + 0.114 * px[j + 2];
    g[i] = y; suma += y; if (y >= 250) quemados++;
  }
  let s = 0, s2 = 0, n = 0;
  for (let yy = 1; yy < h - 1; yy++) for (let xx = 1; xx < w - 1; xx++) {
    const i = yy * w + xx, l = g[i - 1] + g[i + 1] + g[i - w] + g[i + w] - 4 * g[i];
    s += l; s2 += l * l; n++;
  }
  const media = s / n;
  return { nitidez: s2 / n - media * media, luz: suma / g.length, reflejo: quemados / g.length };
}

function juicio(q) {
  const chips = [], motivos = [];
  let mala = false;
  if (q.nitidez < CALIDAD.nitidezMin) {
    mala = true; chips.push(["mal", "❌ Movida"]);
    motivos.push("Movida o desenfocada: apoya los codos, espera a que enfoque y dispara sin mover el móvil.");
  } else chips.push(["ok", "✅ Nítida"]);
  if (q.luz < CALIDAD.luzMin) {
    mala = true; chips.push(["mal", "❌ Oscura"]);
    motivos.push("Muy oscura: enciende la luz 🔦 o acércate a una ventana.");
  } else chips.push(["ok", "✅ Luz"]);
  if (q.reflejo > CALIDAD.reflejoMax) {
    mala = true; chips.push(["mal", "❌ Reflejo"]);
    motivos.push("Reflejo sobre el documento: inclínalo un poco o apaga la linterna.");
  } else chips.push(q.reflejo > CALIDAD.reflejoAviso ? ["ambar", "⚠️ Algo de reflejo"] : ["ok", "✅ Sin reflejos"]);
  return { chips, motivos, mala };
}

function girar180(c) {
  const r = document.createElement("canvas");
  r.width = c.width; r.height = c.height;
  const x = r.getContext("2d");
  x.translate(c.width, c.height); x.rotate(Math.PI); x.drawImage(c, 0, 0);
  return r;
}

// Brillo/contraste: v' = a·v + b en los tres canales
function ajustar(datos, a, b) {
  const p = datos.data;
  for (let i = 0; i < p.length; i += 4) {
    p[i] = a * p[i] + b; p[i + 1] = a * p[i + 1] + b; p[i + 2] = a * p[i + 2] + b;
  }
  return datos;
}

function revisar(lienzo, intentos) {
  return new Promise(resolver => {
    const q = medir(lienzo), { chips, motivos, mala } = juicio(q);
    const forzable = mala && intentos >= CALIDAD.intentosParaForzar;
    $("#revision").hidden = false;
    $("#revCuerpo").innerHTML = `<h1 style="font-size:20px;margin:4px 0 10px">¿Se leen bien las letras?</h1>
      <canvas id="revLienzo"></canvas>
      <div class="chips">${chips.map(([c, t]) => `<span class="chip ${c}">${t}</span>`).join("")}
        <span class="chip" style="background:none;color:#8a8f99">nitidez ${Math.round(q.nitidez)}</span></div>
      ${motivos.length ? `<div class="motivo">${motivos.join("<br>")}</div>` : ""}
      <label>☀️ Brillo <input type="range" id="revBrillo" min="-80" max="80" value="0"></label>
      <label>◐ Contraste <input type="range" id="revContraste" min="50" max="220" value="100"></label>
      <div class="fila"><button id="revAuto">✨ Auto</button><button id="revGirar">↻ Dar la vuelta</button></div>
      <div class="rev-botones">
        <button class="gordo primario" id="revVale" style="justify-content:center" ${mala ? "disabled" : ""}>
          <span class="ic">✅</span><span>Vale, se lee bien</span></button>
        <div class="fila" style="margin:0"><button id="revRepetir">📷 Repetir</button><button id="revCancelar">Cancelar</button></div>
        ${forzable ? `<button class="secund" id="revForzar">Usar igualmente (${intentos} intentos)</button>` : ""}
      </div>`;
    let a = 1, b = 0, base = lienzo;
    const previa = $("#revLienzo"), px = previa.getContext("2d", { willReadFrequently: true });
    let chica;
    const preparar = () => {
      const f = Math.min(1, 900 / base.width);
      previa.width = Math.round(base.width * f); previa.height = Math.round(base.height * f);
      px.drawImage(base, 0, 0, previa.width, previa.height);
      chica = px.getImageData(0, 0, previa.width, previa.height);
    };
    const pintarPrevia = () => {
      const d = new ImageData(new Uint8ClampedArray(chica.data), chica.width, chica.height);
      px.putImageData(a === 1 && b === 0 ? d : ajustar(d, a, b), 0, 0);
    };
    preparar();
    const sliders = () => { $("#revBrillo").value = Math.round(b); $("#revContraste").value = Math.round(a * 100); };
    $("#revBrillo").oninput = ev => { b = +ev.target.value; pintarPrevia(); };
    $("#revContraste").oninput = ev => { a = ev.target.value / 100; pintarPrevia(); };
    $("#revAuto").onclick = () => {   // estira los niveles: el 1 % más oscuro a negro, el 1 % más claro a blanco
      const hist = new Uint32Array(256), p = chica.data;
      for (let i = 0; i < p.length; i += 4) hist[Math.round(0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2])]++;
      const total = p.length / 4;
      let acum = 0, bajo = 0, alto = 255;
      for (let v = 0; v < 256; v++) { acum += hist[v]; if (acum >= total * 0.01) { bajo = v; break; } }
      acum = 0;
      for (let v = 255; v >= 0; v--) { acum += hist[v]; if (acum >= total * 0.01) { alto = v; break; } }
      a = Math.min(2.2, Math.max(0.5, 255 / Math.max(1, alto - bajo))); b = Math.max(-80, Math.min(80, -bajo * a));
      sliders(); pintarPrevia();
    };
    $("#revGirar").onclick = () => { base = girar180(base); preparar(); pintarPrevia(); };
    const terminar = async () => {
      const final = document.createElement("canvas");
      final.width = base.width; final.height = base.height;
      const fx = final.getContext("2d");
      fx.drawImage(base, 0, 0);
      if (a !== 1 || b !== 0) fx.putImageData(ajustar(fx.getImageData(0, 0, final.width, final.height), a, b), 0, 0);
      const blob = await new Promise(r => final.toBlob(r, "image/jpeg", 0.92));
      $("#revision").hidden = true;
      resolver(blob);
    };
    $("#revVale").onclick = terminar;
    if (forzable) $("#revForzar").onclick = terminar;
    $("#revRepetir").onclick = () => { $("#revision").hidden = true; resolver("repetir"); };
    $("#revCancelar").onclick = () => { $("#revision").hidden = true; resolver(null); };
  });
}

// ── El paquete: ZIP + cifrado (mismo formato que lee el programa) ────────────
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function zip(ficheros) {   // [{nombre, datos: Uint8Array}] — sin comprimir (las fotos ya lo están)
  const enc = new TextEncoder(), partes = [], central = [];
  let off = 0;
  for (const f of ficheros) {
    const n = enc.encode(f.nombre), crc = crc32(f.datos), L = f.datos.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint32(14, crc, true); h.setUint32(18, L, true); h.setUint32(22, L, true); h.setUint16(26, n.length, true);
    partes.push(new Uint8Array(h.buffer), n, f.datos);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint32(16, crc, true); c.setUint32(20, L, true); c.setUint32(24, L, true); c.setUint16(28, n.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), n);
    off += 30 + n.length + L;
  }
  const tamC = central.reduce((s, x) => s + x.length, 0);
  const fin = new DataView(new ArrayBuffer(22));
  fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, ficheros.length, true); fin.setUint16(10, ficheros.length, true);
  fin.setUint32(12, tamC, true); fin.setUint32(16, off, true);
  return new Blob([...partes, ...central, new Uint8Array(fin.buffer)]);
}

async function empaquetar(dets) {
  const ficheros = [], entregas = [];
  const reg = indiceReg(), sello = hora().replace(":", "");
  for (const d of dets) {
    const lista = [];
    for (const [hueco, id] of Object.entries(d.fotos)) {
      const b = await blobDe(id);
      if (!b) continue;
      const ext = hueco === "audio" ? ((b.name || "").match(/\.\w+$/) || [".m4a"])[0] : ".jpg";
      const nombre = `R${reg || "X"}_D${d.n}_${hueco}${ext}`;
      ficheros.push({ nombre, datos: new Uint8Array(await b.arrayBuffer()) });
      lista.push({ nombre, tipo: hueco });
    }
    entregas.push({ registro: E.registro || "", lugar: E.registro ? "" : E.lugar, detenido: d.n, documento: d.doc, nota: d.nota || "", ficheros: lista });
  }
  const manifiesto = { formato: 1, tipo: "campo", op_id: OP.op_id, atestado: OP.atestado, agente: E.agente,
                       dispositivo: E.dispositivo, enviado: new Date().toISOString(), entregas };
  ficheros.unshift({ nombre: "manifiesto.json", datos: new TextEncoder().encode(JSON.stringify(manifiesto)) });
  const claro = new Uint8Array(await zip(ficheros).arrayBuffer());
  const MAGIC = new TextEncoder().encode("UDYCOPK"), idb = new TextEncoder().encode(OP.op_id);
  let cabecera, cuerpo;
  try {
    const clave = await crypto.subtle.importKey("raw", Uint8Array.from(atob(OP.clave), c => c.charCodeAt(0)), "AES-GCM", false, ["encrypt"]);
    const nonce = crypto.getRandomValues(new Uint8Array(12));
    const cif = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: nonce, additionalData: MAGIC }, clave, claro));
    cabecera = [MAGIC, new Uint8Array([1, 2, idb.length]), idb, nonce]; cuerpo = cif;
  } catch (_) {
    // navegador que no sabe cifrar: se manda igual, y el programa avisa de que llegó sin cifrar
    cabecera = [MAGIC, new Uint8Array([1, 0, idb.length]), idb]; cuerpo = claro;
  }
  const quien = dets.length === 1 ? `D${dets[0].n}` : `${dets.length}det`;
  // Chrome de Android solo deja compartir ciertas extensiones (fotos, audio, pdf, txt…): con
  // «.udyco» a secas contesta «Permission denied». El programa lo reconoce por dentro, no por el nombre.
  const nombre = `UDYCO_${String(OP.atestado).replace(/[^\w]+/g, "-")}_R${reg || "X"}_${quien}_${sello}.udyco.txt`;
  return new File([...cabecera, cuerpo], nombre, { type: "text/plain" });
}

async function compartir(fichero, texto) {
  if (navigator.canShare && navigator.canShare({ files: [fichero] })) {
    await navigator.share({ files: [fichero], title: texto, text: texto });
    return true;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(fichero); a.download = fichero.name; a.click();
  alert("Se ha guardado el fichero «" + fichero.name + "». Adjúntalo en WhatsApp o Telegram como DOCUMENTO.");
  return true;
}

// Si preparar el paquete tardó (muchas fotos), el navegador ya no cuenta el toque como reciente
// y niega el menú de compartir: se pide un segundo toque, con el paquete ya hecho.
function otroToque(fichero, texto) {
  return new Promise(resolver => {
    const capa = document.createElement("div");
    capa.style.cssText = "position:fixed;inset:0;z-index:50;background:rgba(14,15,18,.75);display:flex;align-items:center;justify-content:center;padding:16px";
    capa.innerHTML = `<div style="background:#fff;border-radius:18px;padding:20px;max-width:420px;width:100%">
      <p style="margin:0 0 14px;font-weight:700">El paquete ya está preparado. Pulsa para abrir WhatsApp / Telegram.</p>
      <button class="gordo primario" style="width:100%">📤 Compartir ahora</button>
      <button class="gordo" style="width:100%;margin-top:10px">Cancelar</button></div>`;
    const [si, no] = capa.querySelectorAll("button");
    const cerrar = ok => { capa.remove(); resolver(ok); };
    no.onclick = () => cerrar(false);
    si.onclick = async () => {
      try { cerrar(await compartir(fichero, texto)); }
      catch (e) {
        if (e.name === "AbortError") return cerrar(false);
        // último recurso: guardarlo en Descargas para adjuntarlo a mano
        const a = document.createElement("a");
        a.href = URL.createObjectURL(fichero); a.download = fichero.name; a.click();
        alert("No se pudo compartir (" + e.message + "). Se ha guardado «" + fichero.name + "» en Descargas: adjúntalo en WhatsApp como DOCUMENTO.");
        cerrar(true);
      }
    };
    document.body.appendChild(capa);
  });
}

async function enviar(dets) {
  if (!dets.length) return alert("No hay nada que enviar todavía.");
  if (!E.agente && !confirm("No has puesto quién eres (C.P. o indicativo). ¿Enviar igualmente?")) return;
  let fichero;
  try { fichero = await empaquetar(dets); }
  catch (e) { return alert("No se pudo preparar el envío: " + e.message); }
  const texto = `UDYCO ${OP.atestado} · ${nombreReg()} · ${dets.map(d => "detenido " + d.n).join(", ")}`;
  try {
    await compartir(fichero, texto);
  } catch (e) {
    if (e.name === "AbortError") return;       // el policía canceló el menú de compartir
    if (e.name !== "NotAllowedError") return alert("No se pudo compartir: " + e.message);
    if (!await otroToque(fichero, texto)) return;
  }
  dets.forEach(d => { d.enviado = hora(); });
  guardarE(); pintar();
}

$("#atras").onclick = () => { vista = vista.p === "detenido" ? { p: "registro" } : { p: "inicio" }; pintar(); };
// Publicada en una web https: el «service worker» guarda la página en el móvil
// para que vuelva a abrir sin cobertura (aunque Safari cierre la pestaña).
if (location.protocol === "https:" && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

if (SIN_DATOS) {
  $("#pantalla").innerHTML = `<div class="aviso error"><b>A este enlace le faltan los datos de la operación.</b><br>
    Pídele al jefe que te lo vuelva a mandar y ábrelo tocándolo en WhatsApp o Telegram (entero, sin cortar).</div>`;
} else {
  // Se pinta YA, sin esperar a IndexedDB (ver abrirDB). Cuando conteste, se
  // repinta por las miniaturas; si no contesta, se avisa de no cerrar la pestaña.
  if (E.registro || E.lugar) vista = { p: "registro" };
  pintar();
  abrirDB().then(() => {
    sinAlmacen = !db;
    const escribiendo = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (!escribiendo && $("#revision").hidden && $("#camara").hidden) pintar();
  });
}
